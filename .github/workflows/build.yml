name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    env:
      CLANG_VER: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base deps
        shell: sh
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates git findutils sed coreutils \
            build-essential \
            wget gnupg lsb-release

      - name: Install LLVM/Clang, PyPy, PHP, Mono (C#, VB)
        shell: bash
        run: |
          set -euo pipefail
          apt-get update

          if [[ -n "${CLANG_VER}" ]]; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            /tmp/llvm.sh "${CLANG_VER}" || (apt-get update && /tmp/llvm.sh "${CLANG_VER}")

            echo "CC=clang-${CLANG_VER}" >> "$GITHUB_ENV"
            echo "CXX=clang++-${CLANG_VER}" >> "$GITHUB_ENV"
          else
            apt-get update
            apt-get install -y --no-install-recommends clang
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

          apt-get install -y --no-install-recommends \
            pypy3 \
            php-cli \
            mono-devel

          wget -qO /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          rm -f /tmp/packages-microsoft-prod.deb

          apt-get update
          apt-get install -y --no-install-recommends dotnet-sdk-8.0

          cat > /usr/local/bin/vbc <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          sdk_ver="$(dotnet --list-sdks | head -n1 | cut -d' ' -f1)"
          if [[ -z "${sdk_ver}" ]]; then
            echo "dotnet SDK not found" >&2
            exit 1
          fi

          vbc_dll="/usr/share/dotnet/sdk/${sdk_ver}/Roslyn/bincore/vbc.dll"
          if [[ ! -f "${vbc_dll}" ]]; then
            echo "Roslyn vbc.dll not found at ${vbc_dll}" >&2
            exit 1
          fi

          mono_api_dir=""
          for p in \
            /usr/lib/mono/4.8-api \
            /usr/lib/mono/4.7.2-api \
            /usr/lib/mono/4.7.1-api \
            /usr/lib/mono/4.7-api \
            /usr/lib/mono/4.6.2-api \
            /usr/lib/mono/4.6.1-api \
            /usr/lib/mono/4.6-api \
            /usr/lib/mono/4.5.2-api \
            /usr/lib/mono/4.5.1-api \
            /usr/lib/mono/4.5-api
          do
            if [[ -f "${p}/mscorlib.dll" && -f "${p}/System.dll" && -f "${p}/System.Core.dll" && -f "${p}/Microsoft.VisualBasic.dll" ]]; then
              mono_api_dir="${p}"
              break
            fi
          done

          if [[ -z "${mono_api_dir}" ]]; then
            echo "Mono API dir with VB runtime not found under /usr/lib/mono" >&2
            exit 1
          fi

          exec dotnet "${vbc_dll}" \
            -noconfig \
            -nostdlib \
            -vbruntime:"${mono_api_dir}/Microsoft.VisualBasic.dll" \
            -r:"${mono_api_dir}/mscorlib.dll" \
            -r:"${mono_api_dir}/System.dll" \
            -r:"${mono_api_dir}/System.Core.dll" \
            "$@"
          EOF
          chmod +x /usr/local/bin/vbc

          ${CC:-clang} --version || true
          ${CXX:-clang++} --version || true
          pypy3 --version
          php -v
          mcs --version
          mono --version
          dotnet --info
          vbc -help >/dev/null

      - name: C/C++ compile check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_ci

          while IFS= read -r -d '' f; do
            out="build_ci/$(echo "$f" | sed 's|^\./||; s|/|__|g; s|\.cpp$||')"
            echo "C++: $f -> $out"
            "$CXX" -std=c++20 -O2 -pipe "$f" -o "$out"
          done < <(find . -type f -name '*.cpp' -print0)

          while IFS= read -r -d '' f; do
            out="build_ci/$(echo "$f" | sed 's|^\./||; s|/|__|g; s|\.c$||')"
            echo "C: $f -> $out"
            "$CC" -std=c11 -O2 -pipe "$f" -o "$out" -lm
          done < <(find . -type f -name '*.c' -print0)

      - name: C# compile check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_ci_cs

          while IFS= read -r -d '' f; do
            out="build_ci_cs/$(echo "$f" | sed 's|^\./||; s|/|__|g; s|\.cs$||').exe"
            echo "C#: $f -> $out"
            mcs -optimize+ -out:"$out" "$f"
          done < <(find . -type f -name '*.cs' -print0)

      - name: VB compile check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_ci_vb

          vb_compiler=""
          if command -v vbc >/dev/null 2>&1; then
            vb_compiler="vbc"
          elif [[ -f "/usr/lib/mono/4.5/vbc.exe" ]]; then
            vb_compiler="mono /usr/lib/mono/4.5/vbc.exe"
          elif [[ -f "/usr/lib/mono/4.7.1-api/vbc.exe" ]]; then
            vb_compiler="mono /usr/lib/mono/4.7.1-api/vbc.exe"
          fi

          while IFS= read -r -d '' f; do
            if [[ -z "$vb_compiler" ]]; then
              echo "VB compiler not found (expected vbc or vbc.exe under /usr/lib/mono)."
              exit 1
            fi

            out="build_ci_vb/$(echo "$f" | sed 's|^\./||; s|/|__|g; s|\.vb$||').exe"
            echo "VB: $f -> $out"
            $vb_compiler -nologo -optimize+ -out:"$out" "$f"
          done < <(find . -type f -name '*.vb' -print0)

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          pypy3 -m compileall -q .

      - name: PHP lint (Zend php-cli)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "PHP: lint $f"
            php -l "$f" > /dev/null
          done < <(find . -type f -name '*.php' -print0)
